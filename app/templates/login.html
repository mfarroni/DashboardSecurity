<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Security Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border border-gray-200">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 text-blue-600 rounded-full mb-3">
                <i class="fas fa-shield-alt text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Security Dashboard</h2>
            <p class="text-xs text-gray-500 mt-1">Accedi con le tue credenziali di sistema</p>
        </div>

        <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-xs font-medium"></div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" required 
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="es. admin">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required 
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="••••••••">
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md text-sm hover:bg-blue-700 transition duration-150">
                Accedi
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">Default Accounts (Sviluppo):</p>
            <div class="mt-1 flex justify-center gap-3 text-xs text-gray-500 font-mono">
                <span>admin / admin123</span>
                <span>•</span>
                <span>analyst / analyst123</span>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');

            errorAlert.classList.add('hidden');
            errorAlert.innerText = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json();
                    errorAlert.innerText = data.detail || 'Credenziali non valide';
                    errorAlert.classList.remove('hidden');
                }
            } catch (err) {
                errorAlert.innerText = 'Errore di connessione al server';
                errorAlert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
