<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Security Dashboard{% endblock %}</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for small interactions -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom styles -->
    <style>
        .badge-critical { @apply bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold shadow-sm; }
        .badge-high { @apply bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold shadow-sm; }
        .badge-medium { @apply bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-bold shadow-sm; }
        .badge-low { @apply bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold shadow-sm; }
        .badge-none { @apply bg-slate-400 text-white font-medium; }
        .badge-ioc { @apply bg-gradient-to-r from-purple-600 to-indigo-700 text-white font-bold shadow-sm; }
        .badge-cisa { @apply bg-gradient-to-r from-emerald-600 to-teal-700 text-white font-bold shadow-sm; }
        
        .cve-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .cve-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        
        .table-row:hover { background-color: #f8fafc; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal */
        .modal-overlay { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(4px);
        }
        .modal-content { 
            max-height: 90vh; 
            overflow-y: auto;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    {% block content %}{% endblock %}
    
    {% block scripts %}{% endblock %}
    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            if (evt.detail.xhr.status === 401) {
                window.location.href = '/login?expired=1';
            }
        });

        // 5-minute inactivity timer (300,000 ms)
        (function() {
            if (window.location.pathname === '/login') return;
            let inactivityTimeout;
            const INACTIVITY_LIMIT = 300000; // 5 minuti in ms

            function resetInactivityTimer() {
                clearTimeout(inactivityTimeout);
                inactivityTimeout = setTimeout(function() {
                    window.location.href = '/api/auth/logout?timeout=1';
                }, INACTIVITY_LIMIT);
            }

            ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function(evt) {
                window.addEventListener(evt, resetInactivityTimer, true);
            });

            resetInactivityTimer();
        })();
    </script>
</body>
</html>
