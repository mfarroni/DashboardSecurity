<!-- Syslog Stats Partial -->
<div class="p-4 space-y-4">
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-gray-50 rounded-lg p-3">
            <p class="text-xs text-gray-500">Totale Log</p>
            <p class="text-2xl font-bold text-gray-900">{{ stats.total }}</p>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
            <p class="text-xs text-gray-500">Con CVE</p>
            <p class="text-2xl font-bold text-red-600">{{ stats.with_cve_mentions }}</p>
        </div>
    </div>
    
    <div>
        <h4 class="font-medium text-gray-900 mb-2">Per Severità</h4>
        <div class="flex flex-wrap gap-2">
            {% for sev, count in stats.by_severity.items() %}
            <span class="px-2 py-1 bg-gray-100 rounded text-sm
                {% if sev in ['emerg', 'alert', 'crit', 'err', 'error', 'critical'] %}bg-red-50 text-red-700
                {% elif sev in ['warning'] %}bg-yellow-50 text-yellow-700
                {% else %}text-gray-700{% endif %}">
                {{ sev }}: {{ count }}
            </span>
            {% endfor %}
        </div>
    </div>
    
    <div>
        <h4 class="font-medium text-gray-900 mb-2">Top Host</h4>
        <div class="space-y-1 max-h-48 overflow-y-auto">
            {% for host, count in stats.top_hosts.items() %}
            <div class="flex justify-between text-sm">
                <span class="text-gray-600 truncate pr-2">{{ host or 'N/A' }}</span>
                <span class="font-medium text-gray-900">{{ count }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
