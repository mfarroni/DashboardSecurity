<!-- Assets by Type Partial -->
<div class="p-4 space-y-4">
    {% for tipo, count in assets_by_type.items() %}
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center
                {% if tipo == 'hardware' %}bg-blue-100 text-blue-600
                {% else %}bg-green-100 text-green-600{% endif %}">
                <i class="fas {% if tipo == 'hardware' %}fa-server{% else %}fa-laptop-code{% endif %}"></i>
            </div>
            <span class="font-medium text-gray-900 capitalize">{{ tipo }}</span>
        </div>
        <span class="text-2xl font-bold text-gray-900">{{ count }}</span>
    </div>
    {% endfor %}
    
    <div class="border-t border-gray-200 pt-4">
        <h4 class="font-medium text-gray-900 mb-3">Per Criticità</h4>
        {% for crit, count in assets_by_criticality.items() %}
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full
                    {% if crit == 'produzione' %}bg-red-500
                    {% elif crit == 'test' %}bg-yellow-500
                    {% else %}bg-gray-400{% endif %}"></span>
                <span class="text-sm text-gray-600 capitalize">{{ crit }}</span>
            </div>
            <span class="font-medium text-gray-900">{{ count }}</span>
        </div>
        {% endfor %}
    </div>
</div>
