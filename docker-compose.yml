version: '3.8'

services:
  app:
    build: .
    container_name: security-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - DATABASE_URL=sqlite:///data/security.db
      - NVD_API_KEY=${NVD_API_KEY:-}
      - LOG_LEVEL=INFO
      - TZ=Europe/Rome
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Reverse proxy opzionale per fase 2 (Proxmox)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  data:
  logs:
  config: