version: '3.8'

services:
  dashboard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-dashboard-app
    restart: always
    environment:
      - DATABASE_URL=sqlite:///./data/security_dashboard.db
      - SECRET_KEY=production-secret-key-change-in-prod
      - ALLOWED_ORIGINS=http://localhost,https://localhost,http://localhost:8000
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: security-dashboard-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - dashboard-app